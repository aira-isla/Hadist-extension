<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Halal Search — pencarian & hadis pilihan">
  <link rel="icon" type="image/x-icon" href="/icon/mosque.png">
  <link rel="preload" href="./icon/MagnifyingGlass.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="script/style.css">
  <title>Halal Search</title>
</head>
<body>
  <div class="main-container">
    <div class="hero">

      <div class="clock">
        <div class="clock-display">
          <span class="clock-time">
            <span id="clockHour">--</span><span class="clock-colon" id="clockColon" aria-hidden="true">:</span><span id="clockMinute">--</span>
          </span>
          <span class="clock-seconds" id="clockSeconds">--</span>
        </div>
        <span class="clock-rule" aria-hidden="true"></span>
        <div class="clock-date">
          <span class="clock-day" id="clockDay">—</span>
          <span class="clock-divider" aria-hidden="true"></span>
          <span class="clock-full" id="clockDate">—</span>
        </div>
      </div>

      <div class="search">
        <input
          class="search-input"
          type="search"
          spellcheck="false"
          placeholder="Cari sesuatu…"
          enterkeyhint="search"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Kotak pencarian">
        <button
          type="button"
          class="search-submit prevent-select"
          aria-label="Cari / Hadis acak">
          <img src="./icon/MagnifyingGlass.svg" alt="" width="20" height="20" decoding="async">
        </button>
      </div>

      <p class="search-hint">Kosongkan kolom &amp; tekan tombol untuk hadis acak</p>

      <div class="quotes">
        <div class="quote-card">
          <div class="quote-scroll">
            <p class="quote-text" id="hadithText">Memuat hadis…</p>
            <p class="quote-character" id="hadithRef">—</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script/hadis-loader.js" defer></script>
  <script src="script/script.js" defer></script>
</body>
</html>
